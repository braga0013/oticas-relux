<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="120" height="70">
  <!-- Reusable brand eye mark (silver brow + white lash + gold iris) -->
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ecef"/>
      <stop offset="0.5" stop-color="#a7adb6"/>
      <stop offset="1" stop-color="#6f757e"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.55" stop-color="#f5be00"/>
      <stop offset="1" stop-color="#c8920a"/>
    </radialGradient>
  </defs>

  <g id="eye">
    <!-- top brow swoosh (silver) -->
    <path d="M6 34 C 30 8, 92 8, 116 30 C 92 18, 40 20, 14 38 Z" fill="url(#silver)"/>
    <!-- lower lash swoosh (white) -->
    <path d="M10 40 C 34 60, 92 60, 112 42 C 90 54, 40 56, 18 44 Z" fill="#f3f4f6"/>
    <!-- iris -->
    <circle cx="68" cy="34" r="15.5" fill="url(#iris)"/>
    <!-- pupil -->
    <circle cx="71" cy="36" r="6.4" fill="#0a0a0a"/>
    <!-- highlight -->
    <circle cx="64.5" cy="29.5" r="2.6" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
