<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Pedidos — Óticas Relux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <style>
    body { min-height: 100vh; }
    .adm { display: none; flex-direction: column; min-height: 100vh; }
    .adm.visible { display: flex; }
    .adm-top { position: sticky; top: 0; z-index: 80; background: var(--bg); border-bottom: 1px solid var(--hair); padding: 0 24px; height: 58px; display: flex; align-items: center; gap: 12px; }
    .adm-top h1 { font-size: 1rem; font-weight: 700; flex: 1; }
    .adm-body { flex: 1; padding: 24px; max-width: 1300px; margin: 0 auto; width: 100%; box-sizing: border-box; }

    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--bg-2); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 40px 32px; width: 100%; max-width: 380px; text-align: center; }
    .login-card h2 { margin-bottom: 6px; }
    .login-card p { color: var(--muted); font-size: .88rem; margin-bottom: 24px; }
    .login-card input { width: 100%; padding: 11px 14px; border: 1px solid var(--hair); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); font-family: inherit; font-size: .95rem; margin-bottom: 12px; box-sizing: border-box; }
    .login-card input:focus { outline: 2px solid var(--gold); }
    .login-err { color: #ef4444; font-size: .85rem; display: none; margin-bottom: 10px; }

    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat { background: var(--bg-2); border: 1px solid var(--hair); border-radius: var(--r-md); padding: 12px 18px; min-width: 100px; }
    .stat-n { font-size: 1.5rem; font-weight: 700; line-height: 1; }
    .stat-l { font-size: .73rem; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-top: 3px; }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar input[type=search] { flex: 1; min-width: 180px; padding: 9px 14px; border: 1px solid var(--hair); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); font-family: inherit; font-size: .9rem; }
    .toolbar input[type=search]:focus { outline: 2px solid var(--gold); }
    .toolbar select { padding: 9px 12px; border: 1px solid var(--hair); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); font-family: inherit; font-size: .88rem; }

    .tbl-wrap { overflow-x: auto; background: var(--bg-2); border: 1px solid var(--hair); border-radius: var(--r-md); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    thead th { padding: 10px 12px; text-align: left; color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; border-bottom: 1px solid var(--hair); white-space: nowrap; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid var(--hair-soft); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface-2); }

    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .s-aguardando_pagamento { background: rgba(245,190,0,.15); color: #b45309; }
    .s-pago                 { background: rgba(34,197,94,.15);  color: #16a34a; }
    .s-em_preparo           { background: rgba(59,130,246,.15); color: #2563eb; }
    .s-enviado              { background: rgba(139,92,246,.15); color: #7c3aed; }
    .s-entregue             { background: rgba(34,197,94,.25);  color: #15803d; }
    .s-cancelado            { background: rgba(239,68,68,.15);  color: #dc2626; }

    .btn-detail { background: var(--bg); border: 1px solid var(--hair); color: var(--ink); border-radius: var(--r-sm); padding: 4px 12px; font-size: .78rem; font-weight: 600; cursor: pointer; }
    .btn-detail:hover { border-color: var(--gold); }

    /* Drawer */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }
    .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(620px, 100%); background: var(--bg); border-left: 1px solid var(--hair); z-index: 201; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); }
    .drawer.open { transform: none; }
    .drawer-head { padding: 18px 20px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .drawer-head h2 { font-size: 1rem; flex: 1; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }

    .dsec { font-size: .75rem; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; padding: 10px 0 6px; border-top: 1px solid var(--hair); margin-top: 6px; }
    .dsec:first-child { border-top: none; margin-top: 0; padding-top: 0; }
    .drow { display: flex; justify-content: space-between; font-size: .88rem; padding: 4px 0; }
    .drow span:first-child { color: var(--muted); }
    .drow strong { text-align: right; }

    .d-items { border: 1px solid var(--hair); border-radius: var(--r-sm); overflow: hidden; margin-bottom: 4px; }
    .d-item { display: flex; justify-content: space-between; padding: 8px 12px; font-size: .85rem; border-bottom: 1px solid var(--hair-soft); }
    .d-item:last-child { border-bottom: none; }

    .track-form { display: flex; gap: 8px; margin-top: 12px; }
    .track-form input { flex: 1; padding: 10px 12px; border: 1px solid var(--hair); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); font-family: inherit; font-size: .9rem; }
    .track-form input:focus { outline: 2px solid var(--gold); }

    .status-select { padding: 9px 12px; border: 1px solid var(--hair); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); font-family: inherit; font-size: .9rem; width: 100%; margin-top: 8px; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: #18181b; color: #fff; border-radius: var(--r-md); padding: 10px 20px; font-size: .88rem; font-weight: 500; z-index: 999; transition: transform .25s; pointer-events: none; white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.err { background: #ef4444; }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div id="loginWrap" class="login-wrap">
    <div class="login-card">
      <svg viewBox="0 0 48 48" width="48" height="36" style="margin:0 auto 16px;display:block" aria-hidden="true">
        <rect x="4" y="8" width="40" height="32" rx="4" fill="none" stroke="var(--gold)" stroke-width="3"/>
        <path d="M14 20h20M14 28h12" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <h2>Admin Pedidos</h2>
      <p>Acesso restrito à equipe.</p>
      <p id="loginErr" class="login-err">Usuário ou senha incorretos.</p>
      <form id="loginForm">
        <input type="text" id="loginUser" placeholder="Usuário" autocomplete="username" required />
        <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password" required />
        <button class="btn btn-primary btn-block" type="submit" style="width:100%;justify-content:center">Entrar</button>
      </form>
    </div>
  </div>

  <div id="admApp" class="adm">
    <header class="adm-top">
      <h1>Pedidos</h1>
      <a href="admin-produtos.html" class="btn btn-ghost" style="font-size:.82rem">Produtos</a>
      <a href="index.html" class="btn btn-ghost" style="font-size:.82rem">Ver site</a>
      <button id="logoutBtn" class="btn btn-ghost" style="font-size:.82rem">Sair</button>
    </header>

    <div class="adm-body">
      <div class="stats" id="statsBar">
        <div class="stat"><div class="stat-n" id="sTot">—</div><div class="stat-l">Total</div></div>
        <div class="stat"><div class="stat-n" id="sPend">—</div><div class="stat-l">Ag. pgto</div></div>
        <div class="stat"><div class="stat-n" id="sPago">—</div><div class="stat-l">Pagos</div></div>
        <div class="stat"><div class="stat-n" id="sEnv">—</div><div class="stat-l">Enviados</div></div>
        <div class="stat"><div class="stat-n" id="sRec" style="color:var(--gold-deep)">—</div><div class="stat-l">Receita</div></div>
      </div>

      <div class="toolbar">
        <input type="search" id="searchQ" placeholder="Buscar por cliente, número, e-mail..." />
        <select id="filterStatus">
          <option value="">Todos os status</option>
          <option value="aguardando_pagamento">Ag. pagamento</option>
          <option value="pago">Pago</option>
          <option value="em_preparo">Em preparação</option>
          <option value="enviado">Enviado</option>
          <option value="entregue">Entregue</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <button class="btn btn-ghost" id="refreshBtn">↻ Atualizar</button>
      </div>

      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Nº Pedido</th>
              <th>Data</th>
              <th>Cliente</th>
              <th>Itens</th>
              <th>Total</th>
              <th>Pagamento</th>
              <th>Entrega</th>
              <th>Status</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="pedidosTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Drawer detalhe do pedido -->
  <div id="drawerOverlay" class="drawer-overlay"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-head">
      <h2 id="drawerTitle">Pedido</h2>
      <button id="drawerClose" class="btn btn-ghost" style="padding:6px 12px">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
  (function () {
    var ADMIN_USER = "RELUXADMIN", ADMIN_PASS = "DOMINGO12";
    var API = "/api/admin";

    var STATUS_LABEL = {
      aguardando_pagamento: "Ag. pagamento",
      pago: "Pago", em_preparo: "Em preparação",
      enviado: "Enviado", entregue: "Entregue", cancelado: "Cancelado"
    };
    var PAY_LABEL = { pix: "PIX", boleto: "Boleto", card: "Cartão" };

    function el(id) { return document.getElementById(id); }
    function fmtDate(d) { return new Date(d).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", dateStyle: "short", timeStyle: "short" }); }
    function fmtBRL(n) { return "R$ " + Number(n).toFixed(2).replace(".", ","); }

    /* ── Auth ── */
    function getAuth() { try { return JSON.parse(sessionStorage.getItem("relux-adm")); } catch(e) { return null; } }
    function checkLogin() {
      var a = getAuth();
      if (a && a.u === ADMIN_USER && a.p === ADMIN_PASS) { el("loginWrap").style.display = "none"; el("admApp").classList.add("visible"); loadPedidos(); }
      else { el("loginWrap").style.display = ""; el("admApp").classList.remove("visible"); }
    }
    el("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      var u = el("loginUser").value.trim(), p = el("loginPass").value;
      if (u === ADMIN_USER && p === ADMIN_PASS) { sessionStorage.setItem("relux-adm", JSON.stringify({u:u,p:p})); el("loginErr").style.display="none"; checkLogin(); }
      else el("loginErr").style.display = "";
    });
    el("logoutBtn").addEventListener("click", function() { sessionStorage.removeItem("relux-adm"); checkLogin(); });

    /* ── Toast ── */
    var toastT;
    function toast(msg, err) {
      var t = el("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
      clearTimeout(toastT); toastT = setTimeout(function(){ t.className = "toast"; }, 3200);
    }

    /* ── API ── */
    function api(body) {
      var a = getAuth() || {};
      return fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "X-Admin-User": a.u||"", "X-Admin-Pass": a.p||"" }, body: JSON.stringify(body) })
        .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||"Erro"); return d; }); });
    }

    /* ── State ── */
    var allPedidos = [], currentPedido = null;

    /* ── Carregar ── */
    function loadPedidos() {
      el("pedidosTbody").innerHTML = '<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--muted)">Carregando...</td></tr>';
      api({ action: "orders" })
        .then(function(data) { allPedidos = data || []; renderStats(); renderTable(); })
        .catch(function(e) { el("pedidosTbody").innerHTML = '<tr><td colspan="9" style="text-align:center;padding:24px;color:#ef4444">' + e.message + '</td></tr>'; });
    }
    el("refreshBtn").addEventListener("click", loadPedidos);

    /* ── Stats ── */
    function renderStats() {
      el("sTot").textContent = allPedidos.length;
      el("sPend").textContent = allPedidos.filter(function(p){ return p.status==="aguardando_pagamento"; }).length;
      el("sPago").textContent = allPedidos.filter(function(p){ return p.status==="pago"||p.status==="em_preparo"; }).length;
      el("sEnv").textContent  = allPedidos.filter(function(p){ return p.status==="enviado"; }).length;
      var rec = allPedidos.filter(function(p){ return p.status!=="cancelado"&&p.status!=="aguardando_pagamento"; }).reduce(function(s,p){ return s+(p.total||0); }, 0);
      el("sRec").textContent  = fmtBRL(rec);
    }

    /* ── Filtros ── */
    function getFiltered() {
      var q = (el("searchQ").value||"").toLowerCase().trim();
      var st = el("filterStatus").value;
      return allPedidos.filter(function(p) {
        if (st && p.status !== st) return false;
        if (q) { var txt = [(p.numero||""),(p.customer_name||""),(p.customer_email||""),(p.customer_phone||"")].join(" ").toLowerCase(); if (txt.indexOf(q)===-1) return false; }
        return true;
      });
    }
    el("searchQ").addEventListener("input", renderTable);
    el("filterStatus").addEventListener("change", renderTable);

    /* ── Tabela ── */
    function renderTable() {
      var list = getFiltered();
      if (!list.length) { el("pedidosTbody").innerHTML='<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--muted)">Nenhum pedido encontrado.</td></tr>'; return; }
      el("pedidosTbody").innerHTML = list.map(function(p) {
        var its = Array.isArray(p.items) ? p.items : [];
        var itStr = its.length ? its.map(function(i){ return (i.qty>1?i.qty+"× ":"")+i.name; }).join(", ").slice(0,40)+(its.join(", ").length>40?"…":"") : "—";
        return '<tr data-num="'+p.numero+'">' +
          '<td><strong>'+p.numero+'</strong></td>' +
          '<td style="white-space:nowrap">'+fmtDate(p.created_at)+'</td>' +
          '<td><strong>'+(p.customer_name||"—")+'</strong><br><span style="font-size:.75rem;color:var(--muted)">'+(p.customer_phone||"")+'</span></td>' +
          '<td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+itStr+'">'+itStr+'</td>' +
          '<td><strong>'+fmtBRL(p.total||0)+'</strong></td>' +
          '<td>'+(PAY_LABEL[p.payment_method]||p.payment_method||"—")+'</td>' +
          '<td>'+(p.delivery_type==="loja"?"Retirada":(p.shipping_method||"Entrega"))+'</td>' +
          '<td><span class="status-badge s-'+p.status+'">'+(STATUS_LABEL[p.status]||p.status)+'</span></td>' +
          '<td><button class="btn-detail" data-num="'+p.numero+'">Abrir</button></td>' +
          '</tr>';
      }).join("");
      el("pedidosTbody").querySelectorAll("[data-num]").forEach(function(btn) {
        btn.addEventListener("click", function() { openDrawer(btn.getAttribute("data-num")); });
      });
    }

    /* ── Drawer ── */
    function openDrawer(numero) {
      currentPedido = allPedidos.find(function(p){ return p.numero===numero; });
      if (!currentPedido) return;
      var p = currentPedido;
      el("drawerTitle").textContent = "Pedido " + p.numero;

      var its = Array.isArray(p.items) ? p.items : [];
      var addr = p.shipping_address;
      var addrStr = p.delivery_type==="loja" ? "Retirada na loja" :
        (addr ? addr.rua+", "+addr.numero+(addr.comp?" ("+addr.comp+")":"")+"\n"+addr.bairro+", "+addr.cidade+"/"+addr.uf+" — CEP "+addr.cep : "—");

      el("drawerBody").innerHTML =
        '<p class="dsec">Cliente</p>' +
        '<div class="drow"><span>Nome</span><strong>'+(p.customer_name||"—")+'</strong></div>' +
        '<div class="drow"><span>Telefone</span><strong>'+(p.customer_phone||"—")+'</strong></div>' +
        '<div class="drow"><span>E-mail</span><strong>'+(p.customer_email||"—")+'</strong></div>' +
        '<div class="drow"><span>CPF</span><strong>'+(p.customer_cpf||"—")+'</strong></div>' +

        '<p class="dsec">Produtos</p>' +
        '<div class="d-items">' + (its.length ? its.map(function(it){
          return '<div class="d-item"><span>'+(it.qty>1?it.qty+"× ":"")+it.name+(it.brand?" — "+it.brand:"")+'</span><span>'+fmtBRL((it.price||0)*(it.qty||1))+'</span></div>';
        }).join("") : '<div class="d-item"><span>—</span></div>') + '</div>' +
        '<div class="drow" style="margin-top:4px"><span>Subtotal</span><span>'+fmtBRL(p.subtotal||0)+'</span></div>' +
        (p.discount>0?'<div class="drow"><span>Desconto Pix</span><span style="color:#16a34a">− '+fmtBRL(p.discount)+'</span></div>':'')+
        '<div class="drow"><span>Frete ('+(p.shipping_method||"—")+')</span><span>'+(p.shipping_price>0?fmtBRL(p.shipping_price):"Grátis")+'</span></div>' +
        '<div class="drow"><span><strong>Total</strong></span><strong>'+fmtBRL(p.total||0)+'</strong></div>' +

        '<p class="dsec">Pagamento e Entrega</p>' +
        '<div class="drow"><span>Pagamento</span><strong>'+(PAY_LABEL[p.payment_method]||p.payment_method||"—")+'</strong></div>' +
        '<div class="drow"><span>Status pgto</span><strong>'+(p.payment_status||"—")+'</strong></div>' +
        '<div class="drow"><span>Entrega</span><strong style="white-space:pre-line">'+addrStr+'</strong></div>' +

        '<p class="dsec">Status do Pedido</p>' +
        '<div style="margin-bottom:12px"><span style="font-size:.8rem;color:var(--muted)">Status atual:</span>' +
        '<select class="status-select" id="statusSel">' +
        ['aguardando_pagamento','pago','em_preparo','enviado','entregue','cancelado'].map(function(s){
          return '<option value="'+s+'"'+(p.status===s?' selected':'')+'>'+STATUS_LABEL[s]+'</option>';
        }).join("") + '</select>' +
        '<button class="btn btn-primary" id="saveStatusBtn" style="margin-top:8px;width:100%;justify-content:center">Salvar status</button></div>' +

        '<p class="dsec">Código de Rastreio</p>' +
        (p.tracking_code ? '<div class="drow" style="margin-bottom:8px"><span>Código atual</span><strong style="letter-spacing:2px">'+p.tracking_code+'</strong></div>' : '') +
        '<div class="track-form">' +
        '<input id="trackInput" placeholder="Ex: BR123456789BR" value="'+(p.tracking_code||"")+'" />' +
        '<button class="btn btn-primary" id="sendTrackBtn">Enviar ao cliente</button>' +
        '</div>' +
        '<p style="font-size:.76rem;color:var(--muted);margin-top:6px">Ao clicar, o status muda para "Enviado" e o cliente recebe um e-mail automático com o código.</p>';

      el("saveStatusBtn").addEventListener("click", function() {
        var ns = el("statusSel").value;
        api({ action: "order-update", numero: p.numero, data: { status: ns } })
          .then(function() {
            p.status = ns; renderStats(); renderTable();
            toast("Status atualizado!"); closeDrawer();
          }).catch(function(e){ toast(e.message, true); });
      });

      el("sendTrackBtn").addEventListener("click", function() {
        var code = (el("trackInput").value||"").trim().toUpperCase();
        if (!code) { toast("Digite o código de rastreio.", true); return; }
        el("sendTrackBtn").disabled = true;
        el("sendTrackBtn").textContent = "Enviando...";
        api({ action: "send-tracking", numero: p.numero, tracking_code: code })
          .then(function(r) {
            p.tracking_code = code; p.status = "enviado"; renderStats(); renderTable();
            toast(r.email_sent ? "Código enviado ao cliente por e-mail!" : "Código salvo (e-mail não configurado).");
            closeDrawer();
          }).catch(function(e){ el("sendTrackBtn").disabled=false; el("sendTrackBtn").textContent="Enviar ao cliente"; toast(e.message, true); });
      });

      el("drawerOverlay").classList.add("open");
      el("drawer").classList.add("open");
    }

    function closeDrawer() {
      el("drawerOverlay").classList.remove("open");
      el("drawer").classList.remove("open");
    }
    el("drawerClose").addEventListener("click", closeDrawer);
    el("drawerOverlay").addEventListener("click", closeDrawer);

    checkLogin();
  })();
  </script>
</body>
</html>
